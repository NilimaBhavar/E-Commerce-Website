kind = "web"
  previewPath = "/"
  title = "Tara Shop - Indian General Store"
  version = "1.0.0"
  id = "artifacts/store"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 24964

  [services.development]
  run = "pnpm --filter tara-shop-client run dev"

  [services.production]
  build = [ "pnpm", "--filter", "tara-shop-client", "run", "build" ]
  publicDir = "client/dist"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "24964"
  BASE_PATH = "/"
  